name: taraqqiyot

services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    image: taraqqiyot-web
    container_name: taraqqiyot-web
    restart: unless-stopped
    # Token va guruh ID faqat shu yerdan, konteyner ishga tushganda beriladi.
    env_file: .env
    environment:
      LEADS_LOG: /data/leads.jsonl
    volumes:
      - leads-data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3800}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  leads-data:
